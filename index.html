<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Covvy's World - Hub | International Directory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg: #05070f;
            --bg-card: rgba(15, 23, 42, 0.75);
            --bg-hover: rgba(30, 41, 70, 0.9);
            --accent: #6366f1;
            --accent2: #22d3ee;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.1);
            --glow: 0 0 25px rgba(99, 102, 241, 0.25);
            --glow2: 0 0 30px rgba(34, 211, 238, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Enhanced Dynamic Background */
        .grid-background {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -2;
            pointer-events: none;
        }

        .grid-background::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(34, 211, 238, 0.08), transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(99, 102, 241, 0.08), transparent 50%);
            z-index: -1;
        }

        /* Sidebar */
        aside {
            width: 320px;
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .sidebar-brand {
            padding: 32px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.4rem;
            box-shadow: var(--glow);
        }

        .sidebar-brand h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            background: linear-gradient(to right, #f1f5f9, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent2);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 20px 24px 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 3px solid transparent;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(99, 102, 241, 0.1);
            color: white;
            border-left-color: var(--accent);
        }

        .nav-link i {
            width: 20px;
            color: var(--accent);
        }

        /* Main Content */
        main {
            margin-left: 320px;
            padding: 48px;
            min-height: 100vh;
        }

        .hub-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            padding: 8px 18px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        /* Dashboard Hero */
        .dashboard-hero {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(10, 15, 30, 0.95));
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 24px;
            padding: 72px 64px;
            margin-bottom: 48px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--glow);
        }

        .dashboard-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15), transparent 70%);
            pointer-events: none;
        }

        .dashboard-hero h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(to right, #f8fafc, #67e8f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        /* Search Bar */
        .search-container {
            background: var(--bg-card);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 20px;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
        }

        .search-container:focus-within {
            border-color: var(--accent2);
            box-shadow: var(--glow2);
            transform: translateY(-2px);
        }

        .search-input {
            background: none;
            border: none;
            outline: none;
            width: 100%;
            color: white;
            font-size: 1.1rem;
        }

        /* Category Cards */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 28px;
        }

        .category-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            transition: all 0.4s cubic-bezier(0.4, 0.0, 0.2, 1);
            backdrop-filter: blur(12px);
        }

        .category-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: var(--accent2);
            box-shadow: var(--glow2);
        }

        .category-card-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent);
            transition: all 0.4s ease;
        }

        .category-card:hover .category-card-icon {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            transform: rotate(12deg);
        }

        /* Directory Items */
        .directory-item-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            transition: all 0.4s ease;
            backdrop-filter: blur(12px);
        }

        .directory-item-card:hover {
            border-color: var(--accent2);
            box-shadow: var(--glow);
            transform: translateY(-6px);
        }

        .launch-btn {
            margin-top: 20px;
            width: 100%;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            color: white;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.4s ease;
        }

        .directory-item-card:hover .launch-btn {
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            color: white;
            border-color: transparent;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            aside {
                transform: translateX(-100%);
                transition: 0.4s ease;
            }
            main {
                margin-left: 0;
                padding: 24px;
            }
        }
    </style>
</head>
